# BmcWar - wars by the clock. Everything about cities, wars, sides and players comes from the site.

site:
  # How often the site's data is downloaded again (minutes).
  refresh-minutes: 5
  # The site's list of maps (maps.json, the same list the Xaero's mod reads). Every map on it becomes a war map by itself, as soon
  # as this server has its Minecraft world (its "world", else its "dynmapWorld", else this server's main world): a new map on the
  # site needs nothing done here, and one whose world this server does not have downloads nothing.
  # "" = no list: only the maps below.
  worlds: https://bmcmc.online/maps.json

# Nothing is needed here: the maps come from the site's list (above). Use this only to change one of them, to turn one off, or to
# add a map the site does not list. /bmcwar maps shows every map and whether its world, its data and its dynmap markers are there.
#   gaia:                  # the map's key in the site's maps.json (or any name, for a map of your own)
#     world: world         # the Minecraft world on THIS server, when its name is not the site's
#     dynmap-world: world  # the dynmap world its markers are in, when not the same
#     wars: []             # which wars to run (their ids); [] = every war marked "live" that has not ended
#     enabled: false       # turn it off on this server
#     site: https://...    # its territories.json (needed only for a map the site's list does not have)
maps: {}

# The BMC Atlas client mod: tell it, through the game connection (channel "bmcatlas:sync"), who holds each city of the live wars and
# when the site's data changed, only when something changes. Players with the mod then stop asking dynmap for the war markers every
# few seconds and the site every half hour. Players without the mod get nothing. false = the mod asks dynmap and the site itself.
updates:
  # Tell the staff (console, and bmcwar.admin players when they join) when a newer BmcWar is out. Read from GitHub on start and
  # every 6 hours. false = no update checks at all.
  check: true
  # Tell a player whose BMC Atlas mod is out of date, with a link to download the new one.
  warn-old-mod: true

mod-sync:
  enabled: true

# Diplomatic news: what changed in the site's diplomacy between two downloads (wars declared and ended, alliances formed, joined, left
# and dissolved, truces, non-aggression pacts, ultimatums, subjects). Kept in plugins/BmcWar/news.json and read with /news (a book; the
# Staff's "notes" for a war or an alliance on the site are shown there). The first download of a map only remembers what is there.
news:
  enabled: true
  # The kinds said in the chat when they happen; every kind is kept for /news anyway.
  # Kinds: war, peace, alliance, alliance-join, alliance-leave, alliance-end, truce, nap, ultimatum, vassal, independence
  announce: [war, peace, alliance, alliance-join, alliance-leave, alliance-end, ultimatum, vassal, independence]
  # How many news are kept (the book shows the latest 30).
  keep: 50
  # Tell players who join how many news came out since they last opened /news.
  on-join: true

capture:
  # How long (SECONDS) a side must stay inside a locality's land, with no opponent there, to take it (Laws 7.8.5-6):
  #   Settlement = Small, Medium, Large or Colonial (5.8.4)
  #   Fort       = a Fort that is not a Settlement: drawn as a Fort, designated "Fort" on the site, or a Capital that is not a
  #                Settlement (5.5.6, 5.6.7)
  #   Locality   = everything else: taken the moment an attacker is inside with no opponent there
  # Warzones are not used: cities joined by a yellow line on the site's map are captured one by one (the line is just a Connection).
  seconds:
    Settlement: 30
    Fort: 15
    Locality: 0
  # A capital takes this many times as long as its type says.
  capital-multiplier: 1
  # Someone of the side that holds the city inside it is resistance: the city shows as contested.
  # reset = the time starts over when the resistance ends: a Fort is only taken after 15 s, a Settlement after 30 s, of no enemy
  #         presence (Laws 7.8.5-6). A Locality is taken the moment the resistance is gone (7.8.3).
  # pause = the timer stops while an opponent is inside and goes on from where it was when he leaves (NOT the Laws: a city
  #         nearly taken before the defenders came falls the second they leave).
  on-resistance: reset
  # Seconds the attackers may be out of the city before the attempt is dropped (0 = dropped the moment they leave).
  grace-seconds: 0
  # Seconds after a city is taken during which it cannot be taken again (0 = no cooldown).
  cooldown-seconds: 0
  # Players of a side that must be inside for the time to run.
  min-attackers: 1
  # Players who are flying (fly mode) or gliding (elytra) do not count, neither as attackers nor as resistance.
  ignore-flying: true
  # ...but only after this many seconds of flying or gliding in a row. Jumping off a tower, falling, a wind charge or a mace
  # launch is ordinary fighting and always counts; an elytra opened by mistake on a jump does not take anyone out either.
  air-grace-seconds: 3
  # Players riding a vehicle (the planes of MTVehicles, boats, anything they sit in) with only air in this many blocks under
  # them do not count either. A vehicle on the ground still counts. 0 = vehicles are never ignored.
  ignore-vehicle-above-blocks: 3
  # A city's land is its capture limit (the site's capture.svg), else the province its marker is in.
  # A city with neither gets a round area of this radius (blocks).
  fallback-radius: 40
  # The heights that count in each city (7.8.4: not deep underground, not far above the ground): a player outside them counts
  # neither as attacker nor as resistance. Worked out from each city's terrain: from its lowest ground minus below-ground, up to its
  # highest building plus above-buildings. /bmcwar where shows them; F3 shows your Y.
  height:
    below-ground: 10
    above-buildings: 30
    # Cities set by hand, as Name(Country) like on the site (tunnels or bunkers that are part of the city, a tall tower...). Example:
    #   Siesta(Diarchy): {min: 40, max: 160}
    cities: {}

players:
  # Where a player's country comes from:
  #   team           = their scoreboard team (the tag), matched against the countries' names on the site (default)
  #   site           = the site's population lists
  #   team-then-site = the tag, or the site's lists when their tag names no country
  # A vassal fights for its overlord: a Santana tag is a citizen of Greneshire's side, as the site says Santana is Greneshire's vassal.
  side-from: team
  # Teams whose name is not a country's name on the site: team name -> country. Example:
  #   SAN: Santana
  team-aliases: {}

# The Laws of the Game, Law 7. Each one can be turned off.
rules:
  # A locality may only be captured while In Play: Connected (on the site's map) to a locality held by another side of the war
  # (7.8.1). Needs the "network" the site's exporter writes into territories.json; without it every locality counts as In Play.
  in-play: true
  # Pockets cut off from every Capital their side holds are Encircled and put nothing In Play, except a locality whose capture
  # would break the encirclement (7.8.9-10). Sea routes are not worked out yet: a colony reached only by sea may show as encircled.
  encirclement: true
  # Captures only happen during an Engagement started with /bmcwar engagement start (7.8.8).
  require-engagement: true

engagement:
  # When a nation of the war Capitulates (its capital taken and its score over 100, 7.9.7), the engagement going on ends.
  end-on-capitulation: true
  # A Tactical Campaign, an Assault or a Raid ends as soon as one side holds all of its targets, having taken at least one of them
  # (a Raid: the attackers capture the Fort, 7.17.10; the Fort then goes back as always, 7.17.13).
  end-on-objective: true
  # How long each kind of Engagement lasts at most, in minutes (the Laws' times); it ends by itself then. "free" has no limit.
  minutes:
    strategic: 60
    tactical: 40
    assault: 20
    raid: 30
  # When an engagement starts, everyone with a side in the war is asked on screen whether they are ready, and answers by typing
  # "ready" or "not ready" in the chat (the answer is not shown in the public chat; the staff is told).
  ready-check:
    enabled: true
    # The engagement only begins (captures allowed, its time running) once everyone asked has said "ready". Someone who leaves no
    # longer holds it up; the staff can begin it anyway with /bmcwar engagement go. false = it begins at once and the check only informs.
    wait-for-all: true
    # Those who have not answered are asked again this often...
    remind-every-seconds: 20
    # ...for this long after the engagement began (while it waits for everyone, they keep being asked).
    answer-within-seconds: 120

announce:
  start: true
  contested: true
  captured: true
  aborted: false
  # A nation that Capitulates: in the chat, and a title on the screen of everyone in the war or on its map.
  capitulated: true
  # Show the time left above the hotbar to the players inside the city.
  actionbar: true
