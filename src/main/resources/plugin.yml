name: BmcWar
version: ${version}
main: com.cumania.war.BmcWarPlugin
api-version: "1.21"
description: Wars by the clock - a side that holds a city's land for its time takes it, and dynmap shows the new colour.
softdepend: [dynmap, Multiverse-Core]
commands:
  bmcwar:
    description: Status of the wars, and staff tools
    usage: /bmcwar status | where | table | debug | engagement [start <kind> [cities...] | go | pause | resume | stop] | undo [war] | log [war] [lines] | bridge [<bridge> open|close|site [force]] | set <city> <state> | reset [war] confirm | maps | news | reload
    permission: bmcwar.use
  news:
    description: The diplomatic news - wars, alliances, truces, ultimatums and subjects, as they change on the site
    usage: /news
    aliases: [noticias]
    permission: bmcwar.use
permissions:
  bmcwar.use:
    description: See the status of captures and where you stand
    default: true
  bmcwar.admin:
    description: The Referee's tools - start, pause and stop engagements, undo captures, read the war log, set a city's colour by hand, reset the fronts and reload the plugin
    default: op
  bmcwar.bypass:
    description: Not counted when standing in a city (for staff watching a capture)
    default: false
