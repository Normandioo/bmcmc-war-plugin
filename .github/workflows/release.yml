# Attaches the compiled jar to a GitHub Release.
# Publish a release on GitHub (Releases > Draft a new release, tag v<plugin_version>, e.g. v0.1.0), and this builds
# the plugin and uploads build/libs/BmcWar-<version>.jar to it. It can also be run by hand (Actions > Release > Run workflow)
# for a release that already exists.
# The tag must match plugin_version in gradle.properties (v + version).
name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the jar to (e.g. v0.1.0)
        required: true
permissions:
  contents: write
jobs:
  jar:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Check the tag matches the version
        shell: bash
        run: |
          version=$(grep '^plugin_version=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$TAG" ]; then
            echo "::error title=Version mismatch::tag $TAG but gradle.properties says plugin_version=$version"
            exit 1
          fi
      - run: ./gradlew build --no-daemon
      - name: Upload the jar to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$TAG" build/libs/BmcWar-*.jar --clobber
