# Publishes a GitHub Release with the compiled jar whenever a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# The tag must match plugin_version in gradle.properties (v + version).
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Check the tag matches the version
        shell: bash
        run: |
          version=$(grep '^plugin_version=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error title=Version mismatch::tag $GITHUB_REF_NAME but gradle.properties says plugin_version=$version"
            exit 1
          fi
      - run: ./gradlew build --no-daemon
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" build/libs/BmcWar-*.jar \
            --title "BmcWar $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
