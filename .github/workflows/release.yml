# Publishes a GitHub Release with the compiled jar, named after plugin_version in gradle.properties (v0.1.0, ...).
# It runs when gradle.properties changes on main (bump the version to release), or by hand: Actions > Release > Run workflow.
# If the release for that version already exists, nothing is done.
name: Release
on:
  push:
    branches: [main]
    paths: [gradle.properties]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        shell: bash
        run: |
          tag="v$(grep '^plugin_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists: nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.v.outputs.exists != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - if: steps.v.outputs.exists != 'true'
        uses: gradle/actions/setup-gradle@v4
      - if: steps.v.outputs.exists != 'true'
        run: chmod +x gradlew && ./gradlew build --no-daemon
      - if: steps.v.outputs.exists != 'true'
        name: Create the release
        shell: bash
        run: |
          gh release create "${{ steps.v.outputs.tag }}" build/libs/BmcWar-*.jar \
            --target "$GITHUB_SHA" \
            --title "BmcWar ${{ steps.v.outputs.tag }}" \
            --notes-file .github/release-notes.md
