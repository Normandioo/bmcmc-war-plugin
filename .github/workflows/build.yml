# Builds the plugin on every push / pull request and keeps the jar (repository > Actions > the run > Artifacts > BmcWar).
name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Build
        shell: bash
        run: |
          set +e
          ./gradlew build --no-daemon > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            # the cause also goes to the run's annotations (readable through the API: gh api repos/OWNER/REPO/check-runs/JOB_ID/annotations)
            echo "::error title=Gradle failed::$(grep -E 'error|Could not|What went wrong|wrong|FAILED' -A3 build.log | head -25 | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
          cat build.log
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: BmcWar
          path: build/libs/*.jar
